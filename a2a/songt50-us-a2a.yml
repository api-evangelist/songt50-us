notes: >-
  sapjilcoding (삽질코딩 — the maker brand of Song Tae-Eun, GitHub SongT-50, MCPize handle higheun) serves TWO A2A
  Agent Cards from two subdomains of its own registrable domain songt50.us. Both are live, anonymous JSON-RPC
  agents: the Korean Public Data Agent (weather, air quality, apartment prices, Bank of Korea statistics, business
  registration checks) at publicdata-agent.songt50.us and the Korean News Agent (Korean and global tech news, keyword
  search, trending, daily briefing — "Powered by Korean News MCP") at news-agent.songt50.us. Each host serves the
  identical document at BOTH the canonical /.well-known/agent-card.json and the legacy /.well-known/agent.json;
  every other /.well-known/ path on those hosts returns a 9-byte text/plain "Not Found" 404, so the 200s are served
  documents and not a catch-all. The apex songt50.us answers Cloudflare 522 (origin unreachable) on every path and
  www.songt50.us does not resolve, so the agent subdomains are the provider's only reachable web surface. Ownership
  is not in question: provider.organization is "sapjilcoding" in both cards, provider.url is the serving host, the
  a2aregistry.org records name the author sapjilcoding, and the companion GitHub repositories carry LICENSE
  "Copyright (c) 2026 sapjil-coding" and credit the 삽질코딩 YouTube channel.
