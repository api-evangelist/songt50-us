surface_relationship:
  note: >-
    The two agents are conversational fronts over the same data the provider ships as four open-source MCP servers
    (github.com/SongT-50/korean-public-data-mcp, korean-news-mcp, korean-stock-mcp, korean-agriculture-mcp; see
    mcp/songt50-us-mcp.yml). The public-data agent's five skills map one-to-one onto the public-data MCP server's
    five data tools (weather, air quality, real-estate trades, economic stats, business registration), and the news
    agent's five skills onto five of the six news MCP tools (read_article has no A2A skill). The A2A hosts on
    songt50.us were live on 2026-09-19; the four hosted MCP endpoints on onrender.com were all suspended (503,
    x-render-routing: suspend). No OpenAPI, GraphQL, AsyncAPI, gRPC or SOAP contract is published anywhere.
