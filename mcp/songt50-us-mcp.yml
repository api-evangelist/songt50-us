summary: >-
  sapjilcoding (GitHub SongT-50) publishes FOUR first-party MCP servers, each an open-source Python FastMCP
  service (MIT) with a server.json in the repository and an entry in the official MCP registry (all four published
  2026-03-08, status active, version 1.0.0, each declaring one streamable-http remote on onrender.com): Korean
  Public Data (io.github.SongT-50/korean-public-data-mcp — 6 tools over data.go.kr, AirKorea and Bank of Korea
  ECOS), Korean News Hub (korean-news-mcp — 6 tools over Naver/Google News RSS and tech feeds, no API key),
  Korean Stock Market Data (korean-stock-mcp — 7 tools over the data.go.kr KRX services) and Korean Agriculture
  Market Data (korean-agriculture-mcp — 6 tools over the data.go.kr wholesale-market real-time auction API). The
  READMEs document both the hosted endpoint ("claude mcp add … --transport streamable-http https://<name>.onrender.com/mcp")
  and a local stdio run from a clone ("claude mcp add … -- python server.py"); the data servers need the operator's
  own data.go.kr / ECOS keys when run locally, while "the remote server's API keys are configured on the server".
  PROBED 2026-09-19: every one of the four hosted endpoints returns HTTP 503 "Service Suspended" with
  x-render-routing: suspend on every path (initialize, tools/list, /, /.well-known/*), i.e. the Render free-tier
  services are suspended, not merely asleep (the READMEs warn only of a 30-60 s cold start). The tool lists below
  are therefore read from the provider's own server.py, mcpize.yaml and README — provider-published, not live
  introspection — and inputSchema detail is limited to the typed Python signatures those sources carry. The two
  A2A agents on songt50.us (see a2a/) expose the public-data and news tool sets conversationally and WERE live.
deployment:
  mode: both
  endpoint: https://korean-public-data-mcp.onrender.com/mcp
  install: 'git clone https://github.com/SongT-50/korean-public-data-mcp.git && cd korean-public-data-mcp && pip install -r requirements.txt && claude mcp add korean-public-data -- python server.py'
  package: https://github.com/SongT-50/korean-public-data-mcp
  auth: none
  verified: probed
  probe: dead
  note: >-
    mode is `both` because the provider documents a hosted Streamable HTTP URL an MCP client POSTs to AND a local
    stdio run from source (no npm/PyPI package exists — the PyPI project named korean-news-mcp belongs to a different
    author, LogiStic1207/jespe, and is NOT this provider's). auth is `none` as documented ("API 키 불필요" for the
    news server; the data servers hold their upstream keys server-side and no MCP-level credential, OAuth metadata
    or protected-resource document exists). probe is `dead`: POST initialize and tools/list to the endpoint on
    2026-09-19 returned 503 text/html "Service Suspended" (x-render-routing: suspend), and the same answer came back
    for the other three hosts and for every path on them, slowly re-probed six seconds apart to rule out our own
    burst. An MCP client cannot reach any of the four servers today; the registry still lists all four as active.
    The endpoint recorded is the server that backs the primary A2A agent; the other three are in servers[].
