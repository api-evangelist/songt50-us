- aid: songt50-us:korean-stock-market-mcp
  name: Korean Stock Market Data MCP Server
  description: 'Model Context Protocol server io.github.SongT-50/korean-stock-mcp (official MCP registry, active, 1.0.0,
    published 2026-03-08): seven read-only tools over the data.go.kr Financial Services Commission / KRX services —
    get_stock_price (previous close by name or 6-digit code), search_stock (KOSPI/KOSDAQ/KONEX), get_market_index,
    get_price_trend (up to 30 days), get_dividend_info, compare_stocks and get_popular_stocks. Hosted Streamable HTTP
    remote at https://korean-stock-mcp.onrender.com/mcp; local stdio run needs a data.go.kr key. The repository ships
    server.py, server.json, Dockerfile and render.yaml but no README or LICENSE. The hosted endpoint returned HTTP 503
    Service Suspended on 2026-09-19.'
