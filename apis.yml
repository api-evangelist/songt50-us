    News, TechCrunch, The Verge, Ars Technica, GeekNews), news_search (ko/en keyword), trending, read_article (URL
    body extraction) and daily_briefing. Hosted Streamable HTTP remote at https://korean-news-mcp.onrender.com/mcp;
    local stdio run from source; also listed on MCPize with Free (20 calls/day), Pro ($9.99/month, 500/day) and
    Enterprise ($29.99/month) marketplace plans. Python FastMCP, MIT. The hosted endpoint returned HTTP 503 Service
    Suspended on 2026-09-19.'
