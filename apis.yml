aid: songt50-us
name: sapjilcoding
description: 'sapjilcoding (삽질코딩, GitHub SongT-50) is a Korean independent maker — Song Tae-Eun, a Daejeon wholesale
  produce market director building AI tools for public data — that publishes two live Agent2Agent (A2A) agents on
  its own domain songt50.us and four open-source Model Context Protocol servers listed in the official MCP registry.
  The Korean Public Data Agent answers weather, air quality, apartment prices, Bank of Korea data and
  business-registration checks; the Korean News Agent searches Korean and global tech news. The MCP servers — Korean
  Public Data, Korean News Hub, Korean Stock Market Data and Korean Agriculture Market Data (25 tools, Python FastMCP,
  MIT) — wrap data.go.kr, AirKorea, Bank of Korea ECOS, KRX and the national wholesale-market auction feed. Every
  surface is read-only, anonymous and free; no OpenAPI or REST contract exists. On 2026-09-19 both A2A agents were
  live while all four hosted MCP endpoints were suspended (HTTP 503) and the apex site returned Cloudflare 522.'
