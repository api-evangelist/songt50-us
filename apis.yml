- aid: songt50-us:korean-public-data-agent
  name: Korean Public Data Agent (A2A)
  description: 'Agent2Agent agent at https://publicdata-agent.songt50.us — a JSON-RPC 2.0 endpoint at the host root
    (POST only) with an A2A 0.3.0 agent card at /.well-known/agent-card.json and the legacy /.well-known/agent.json.
    Five text/plain skills: Korea Weather Forecast (25 cities), Korea Air Quality (PM10/PM2.5/ozone), Korea Apartment
    Prices (Seoul districts and major cities), Korea Economic Statistics (base rate, CPI, unemployment, GDP, exports,
    imports, KRW/USD, KOSPI) and Business Registration Check. Anonymous; streaming and push notifications false; no
    extended card. Live on 2026-09-19 (tasks/get for an unknown id returned A2A -32001 Task not found). Listed on
    a2aregistry.org since 2026-03-07.'
