- aid: songt50-us:korean-public-data-mcp
  name: Korean Public Data MCP Server
  description: 'Model Context Protocol server io.github.SongT-50/korean-public-data-mcp (official MCP registry, active,
    1.0.0, published 2026-03-08): six read-only tools over Korean government open data — check_business_registration
    (National Tax Service, batch up to 100), get_real_estate_trades (MOLIT apartment transactions by district and
    month), get_weather_forecast (KMA, 25 cities, 72 h), get_air_quality (AirKorea, 15 locations), get_economic_stats
    (Bank of Korea ECOS: base rate, CPI, unemployment, GDP, exports, imports, KRW/USD, KOSPI) and
    list_supported_options. Hosted Streamable HTTP remote at https://korean-public-data-mcp.onrender.com/mcp with the
    upstream keys held server-side; local stdio run from source needs the operator''s own data.go.kr and ECOS keys.
    Python FastMCP, MIT. The hosted endpoint returned HTTP 503 Service Suspended on 2026-09-19.'
